[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["mpuckett159"]
homepage = "not defined today"
repository = "not defined today"
license = "please don't use this"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["cargo", "derive", "string"] }
kubectl = { version = "0.1.0", path = "crates/kubectl" }
kubectl-apply = { version = "0.1.0", path = "crates/kubectl-apply" }
kubectl-config = { version = "0.1.0", path = "crates/kubectl-config" }
kubectl-get = { version = "0.1.0", path = "crates/kubectl-get" }
kubectl-groups = { version = "0.1.0", path = "crates/kubectl-groups" }
kubectl-printers = { version = "0.1.0", path = "crates/kubectl-printers" }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
serde_yaml = { version = "0.9.34+deprecated"}
serde_json = "1.0.151"
tabprinter = "0.2.2"
colored_json = "5.0.0"
serde_json_path = "0.7.2"

[workspace.dev-dependencies]
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }